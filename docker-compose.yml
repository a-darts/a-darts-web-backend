services:
  postgres:
    image: postgres:16-alpine
    container_name: a-darts_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: a-darts_redis
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server --appendonly yes --save "60 10000" --save "300 100" --save "900 1" --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
